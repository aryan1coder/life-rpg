<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Cybernetic RPG Crest -->
  <polygon points="50,6 88,24 88,76 50,94 12,76 12,24" stroke="url(#goldGrad)" stroke-width="2.5" fill="#0B0E17" fill-opacity="0.9" />
  <!-- Inner Diamond -->
  <polygon points="50,18 76,50 50,82 24,50" stroke="#3B4668" stroke-width="1.5" fill="none" />
  <!-- Core Level Shard -->
  <polygon points="50,26 70,50 50,74 30,50" fill="url(#gemGrad)" filter="url(#glow)" />
  <polygon points="50,34 62,50 50,66 38,50" fill="#FFFFFF" fill-opacity="0.35" />
  <!-- Orbital Nodes -->
  <circle cx="50" cy="6" r="3" fill="#FDE047" />
  <circle cx="88" cy="24" r="2.5" fill="#818CF8" />
  <circle cx="88" cy="76" r="2.5" fill="#818CF8" />
  <circle cx="50" cy="94" r="3" fill="#FDE047" />
  <circle cx="12" cy="76" r="2.5" fill="#818CF8" />
  <circle cx="12" cy="24" r="2.5" fill="#818CF8" />
</svg>
